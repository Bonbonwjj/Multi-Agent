[project]
name = "chatdev-paper-reproduction"
version = "0.1.0"
description = "A compact reproduction of ChatDev (ACL 2024)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
chatdev-repro = "chatdev_repro.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
